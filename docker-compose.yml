# Local Claude Code telemetry stack: OpenSearch + Dashboards + OTel Collector.
# Single-node, security disabled, all ports bound to localhost only.
services:
  opensearch:
    build:
      context: .
      dockerfile: Dockerfile.opensearch
      args:
        OPENSEARCH_VERSION: "3.8.0"
    image: claude-otel-opensearch:3.8.0
    container_name: claude-otel-opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      # Default: named volume. Set CLAUDE_OTEL_DATA_DIR (env or .env) to an
      # absolute host path to bind-mount a directory you control instead — that
      # survives `docker compose down -v`. See scripts/migrate-data-dir.sh.
      - ${CLAUDE_OTEL_DATA_DIR:-opensearch-data}:/usr/share/opensearch/data
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.8.0
    container_name: claude-otel-dashboards
    restart: unless-stopped
    environment:
      - 'OPENSEARCH_HOSTS=["http://opensearch:9200"]'
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy

  otel-collector:
    build:
      context: .
      dockerfile: Dockerfile.collector
      args:
        COLLECTOR_VERSION: "0.116.0"
    image: claude-otel-collector:0.116.0
    container_name: claude-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"   # OTLP gRPC
      - "127.0.0.1:4318:4318"   # OTLP HTTP
    depends_on:
      opensearch:
        condition: service_healthy

volumes:
  opensearch-data:
